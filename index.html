<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet" 
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body class = "container">

    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header__img" alt="Eisenhower matrix">
      <a 
        class="header__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main class="main-container">

      <section class="task-add">
        <label for="new-task" class="task-add__label">Add Item</label>
        <p class="task-add__row">
          <input 
            id="new-task" 
            class="task-add__input" 
            type="text"
          >
          <button class="task-add__button">Add</button>
        </p>
      </section>

      <section class="task-list-sec task-list-sec--todo">
        <h2 class="task-list-sec__title">Todo</h2>
        <ul id="incomplete-tasks" class="task-list task-list--incomplete">
          <li class="task-list__item">
            <input type="checkbox" class="task-list__checkbox">
            <label class="task-list__label">Pay Bills</label>
            <input type="text" class="task-list__input">
            <button class="task-list__button task-list__button--edit">Edit</button>
            <button class="task-list__button task-list__button--remove">
              <img src="./remove.svg" alt="remove task" class="task-list__img">
            </button>
          </li>
          <li class="task-list__item task-list__item--edit-mode">
            <input type="checkbox" class="task-list__checkbox">
            <label class="task-list__label">Go Shopping</label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="task-list__input"
            >
            <button class="task-list__button task-list__button--edit">Save</button>
            <button class="task-list__button task-list__button--remove">
              <img src="./remove.svg" alt="remove task" class="task-list__img">
            </button>
          </li>
        </ul>
      </section>

      <section class="task-list-sec task-list-sec--completed">
        <h2 class="task-list-sec__title">Completed</h2>
        <ul id="completed-tasks" class="task-list task-list--completed">
          <li class="task-list__item">
            <input type="checkbox" class="task-list__checkbox" checked>
            <label class="task-list__label">See the Doctor</label>
            <input type="text" class="task-list__input">
            <button class="task-list__button task-list__button--edit">Edit</button>
            <button class="task-list__button task-list__button--remove">
              <img src="./remove.svg" alt="remove task" class="task-list__img">
            </button>
          </li>
        </ul>
      </section>

    </main>

  <script type="text/javascript" src="app.js"></script>
  </body>
</html>
